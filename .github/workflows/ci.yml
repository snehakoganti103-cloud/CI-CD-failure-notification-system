name: CI and notify monitor

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install flask

      - name: Run Tests
        run: python -m compileall .

      - name: Notify Monitoring Website
        if: always()

        run: |
          echo "Sending build information to monitoring system"
